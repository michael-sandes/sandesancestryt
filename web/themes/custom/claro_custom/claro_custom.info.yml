name: Claro Custom
type: theme
base theme: claro
description: 'A subtheme of Claro for Drupal 11 administration. Customise this theme to tailor the admin UI to your needs.'
package: Custom
core_version_requirement: ^10 || ^11

# Regions inherited from Claro — override only if you need to add/remove regions.
# regions:
#   content: Content

libraries:
  - claro_custom/global-styling
  - claro_custom/global-scripts

# Uncomment to override specific Claro libraries.
# libraries-override:
#   claro/global-styling: claro_custom/global-styling

# Uncomment to extend specific Claro libraries.
# libraries-extend:
#   claro/global-styling:
#     - claro_custom/global-styling
